# XcodeGen spec for the visionOS build.
#
# Why generate a project instead of patching love-src/platform/xcode/love.xcodeproj
# the way mobile/ios/patch_love_src.py does: that script works because it
# *appends* to known pbxproj sections and injects settings into three
# configurations whose 24-hex object IDs are hardcoded. Adding a whole new
# platform target means synthesising a PBXNativeTarget, three
# XCBuildConfigurations, an XCConfigurationList and four build phases -- several
# hundred lines of string surgery against a file love2d/love@main can restructure
# at any time. This file is ~150 declarative lines that survive that.
#
# Regenerated on every build by scripts/build_visionos.sh; the .xcodeproj it
# emits is gitignored.
#
# Paths are relative to mobile/visionos/ (where this file lives).

name: gen1recomp-visionos

options:
  bundleIdPrefix: com.gen1recomp
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SUPPORTED_PLATFORMS: xros xrsimulator
    TARGETED_DEVICE_FAMILY: "7"          # 7 = Apple Vision
    # arm64 only, and pinned rather than left to ARCHS_STANDARD. For the
    # simulator that default still expands to include x86_64, which fails to
    # link with the message "Undefined symbols for architecture x86_64" --
    # blaming the symbols rather than the architecture, so it reads like a
    # missing library. deps/build_deps.sh builds arm64 slices only, which is
    # the correct and only useful target on an Apple Silicon Mac.
    ARCHS: arm64
    XROS_DEPLOYMENT_TARGET: "26.0"
    # Xcode 26 builds Debug configurations as a stub that dlopens the real code
    # from gen1recomp.debug.dylib, so SwiftUI Previews can be injected. Running
    # the app that way produced a launcher window with its chrome and NOTHING
    # inside it, while the very same source built by scripts/build_visionos.sh
    # drew correctly -- a difference that costs an evening to find, because
    # nothing about it looks like a build setting.
    #
    # Off, so that pressing Run in Xcode and running the script give the same
    # binary. Previews are not something this project can use anyway: its views
    # need a booted LOVE behind them.
    ENABLE_DEBUG_DYLIB: NO
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_C_LANGUAGE_STANDARD: "c11"
    ENABLE_BITCODE: NO
    # LÖVE's own headers assume these are reachable unprefixed.
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/love-src/src
      - $(SRCROOT)/love-src/src/modules
      - $(SRCROOT)/love-src/src/libraries
      - $(SRCROOT)/love-src/src/libraries/enet/libenet/include
      - $(SRCROOT)/love-src/src/libraries/physfs
      # Merged headers from deps/*.xcframework, published by build_deps.sh.
      # Needed explicitly because Xcode only propagates an xcframework's
      # Headers dir to targets that *link* it, and liblove is a static
      # library that links nothing.
      - $(SRCROOT)/deps/include
      # FreeType is reached as <ft2build.h>; openal-soft as flat <alc.h>/<al.h>
      # (LOVE_APPLE_USE_FRAMEWORKS is deliberately not defined -- we link our
      # own openal-soft, not the SDK's OpenAL.framework, which XROS.sdk lacks).
      - $(SRCROOT)/deps/include/freetype2
      - $(SRCROOT)/deps/include/AL
      - $(SRCROOT)/deps/include/libmodplug
      - $(SRCROOT)/deps/include/harfbuzz
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      # LOVE_IOS is deliberately left to config.h, which derives it from
      # TARGET_OS_IPHONE (1 on visionOS). See mobile/visionos/README.md for why
      # love.system.getOS() keeps returning "iOS" here.
      - LOVE_VISIONOS=1
      - LOVE_ENABLE_LUAJIT=1
    # The dependency slices built by deps/build_deps.sh.
    FRAMEWORK_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/deps
    # Third-party sources are not ours to keep warning-clean.
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  # ---------------------------------------------------------------- liblove
  liblove:
    type: library.static
    platform: visionOS
    sources:
      - path: love-src/src
        # Without this every .h lands in a public Headers phase, and LÖVE has
        # a Graphics.h / Audio.h / Shader.h in several modules -- they all
        # collide in the one flat include/liblove dir ("Multiple commands
        # produce ..."). Nothing outside this project consumes these headers.
        headerVisibility: project
        excludes:
          # love.cpp is the executable entry point, not library code; the app
          # target compiles it (and on the immersive path replaces its main()).
          - "love.cpp"
          # No OpenGL and no Vulkan on visionOS. Every GLES symbol in XROS.sdk
          # is annotated API_UNAVAILABLE(visionos), and there is no Vulkan
          # loader at all, so these are excluded rather than left to fail at
          # link time with a much less obvious error.
          - "modules/graphics/opengl/**"
          - "modules/graphics/vulkan/**"
          - "libraries/glad/**"
          - "libraries/volk/**"
          - "libraries/vulkanheaders/**"
          - "libraries/vk_video/**"
          - "libraries/vma/**"
          # luasocket picks its socket backend in its makefile rather than
          # with #ifdefs, so the Windows one has to be excluded by hand;
          # usocket.c is the POSIX sibling we keep.
          - "libraries/luasocket/libluasocket/wsocket.c"
          # glslang carries one OSDependent implementation per platform and
          # expects the build system to pick; Unix is ours.
          - "libraries/glslang/glslang/OSDependent/Windows/**"
          - "libraries/glslang/glslang/OSDependent/Web/**"
          # Platform sources for other Apple targets / Android.
          - "common/macos.mm"
          - "common/android.cpp"
    dependencies:
      - framework: deps/luajit.xcframework
        embed: false
      - framework: deps/sdl3.xcframework
        embed: false
      - framework: deps/freetype.xcframework
        embed: false
      - framework: deps/harfbuzz.xcframework
        embed: false
      - framework: deps/ogg.xcframework
        embed: false
      - framework: deps/vorbis.xcframework
        embed: false
      - framework: deps/theora.xcframework
        embed: false
      - framework: deps/modplug.xcframework
        embed: false
      - framework: deps/openal.xcframework
    settings:
      base:
        OTHER_CFLAGS:
          - $(inherited)
          # FreeType's public headers are reached as <ft2build.h> and
          # <freetype/...>; the xcframework puts them at the slice root.
          - -Wno-nullability-completeness

  # ---------------------------------------------------------------- app
  gen1recomp:
    type: application
    platform: visionOS
    sources:
      - path: love-src/src/love.cpp
        group: love
      - path: native
        # The immersive shell owns @main itself, and this target already has
        # one in love.cpp. Compiling both gives a duplicate _main.
        excludes:
          - "immersive/**"
      - path: resources/game.love
        buildPhase: resources
        type: file
        optional: true
      # The app icon. visionOS wants three layers rather than one image --
      # the system parallaxes them as the wearer looks at it -- so this is a
      # .solidimagestack in an asset catalogue rather than a PNG in the plist.
      # The catalogue is a normal source entry, not a folder reference: it has
      # to be COMPILED, and a folder reference would copy the .xcassets in
      # whole and leave the app with no icon at all.
      - path: resources/Assets.xcassets
        buildPhase: resources
      # Folder references, so each .lproj lands in the bundle root under its
      # own name -- which is where the system looks for a language. English is
      # the development region and the fallback: a key missing from de.lproj
      # resolves out of en.lproj, and one missing from both resolves to
      # itself, so an untranslated string reads as English rather than as an
      # identifier.
      - path: resources/en.lproj
        buildPhase: resources
        type: folder
      - path: resources/de.lproj
        buildPhase: resources
        type: folder
    dependencies:
      - target: liblove
      - framework: deps/luajit.xcframework
        embed: false
      - framework: deps/sdl3.xcframework
        embed: false
      - framework: deps/freetype.xcframework
        embed: false
      - framework: deps/harfbuzz.xcframework
        embed: false
      - framework: deps/ogg.xcframework
        embed: false
      - framework: deps/vorbis.xcframework
        embed: false
      - framework: deps/theora.xcframework
        embed: false
      - framework: deps/modplug.xcframework
        embed: false
      # openal-soft is LGPL-2.1 and therefore dynamic rather than statically
      # linked; see deps/build_deps.sh. embed: false because Xcode's embed
      # machinery only understands .framework bundles -- an xcframework holding
      # a bare .dylib links fine and then produces an app that dies at launch
      # with "Library not loaded: @rpath/libopenal.1.dylib". The postBuildScript
      # below does the copy and the signing instead.
      - framework: deps/openal.xcframework
        embed: false
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreHaptics.framework
      - sdk: UniformTypeIdentifiers.framework
      # SDL3's UIKit backend and LÖVE's Apple bits pull these in. They are
      # listed explicitly rather than discovered, because a missing one shows
      # up only as an undefined symbol at link time.
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: Foundation.framework
      # System zlib, used by physfs's zip archiver and love.data.
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: gen1recomp
        # Point at the checked-in overlays as plain build settings rather than
        # using XcodeGen's `info:` / `entitlements:` blocks. Those blocks
        # GENERATE the file at the given path -- aiming them at a hand-written
        # plist silently overwrites it, and the app then ships without its
        # scene manifest or usage descriptions and refuses to launch.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: $(SRCROOT)/overlays/love-visionos.plist
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/overlays/gen1recomp-visionos.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gen1recomp.xr
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        # SwiftUI + ObjC++ in one target: the bridging header is what lets the
        # Swift immersive shell call into the C ABI that src/modules/xr exposes.
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/native/gen1recomp-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
    postBuildScripts:
      - name: Embed and sign openal-soft
        basedOnDependencyAnalysis: false
        script: |
          # openal-soft is a dynamic library on purpose -- LGPL-2.1 section 6
          # asks that the user be able to swap it -- and it is embedded as a
          # FRAMEWORK, not as the bare .dylib it arrives as.
          #
          # Not a nicety. A standalone dylib is rejected outright by App Store
          # Connect, and the message names something else entirely:
          #
          #   ITMS-90426: Invalid Swift Support -- The SwiftSupport folder is
          #   missing. Rebuild your app using the current public (GM) version
          #   of Xcode and resubmit it.
          #
          # Nothing to do with Swift, and no version of Xcode fixes it. Apple's
          # own answer (developer.apple.com/forums/thread/765288): iOS -- and
          # visionOS with it -- supports third-party frameworks and does not
          # support third-party standalone dynamic libraries, "the only
          # exception being the Swift system libraries provided by Xcode". The
          # checker sees a lone dylib in the bundle, concludes it can only be
          # one of those, and reports the folder that would have accompanied it
          # as missing.
          #
          # The other half of this lives in deps/build_deps.sh, which gives the
          # library the install_name @rpath/openal.framework/openal before
          # anything links against it. It has to be right by then: the linker
          # copies that name into the app, and correcting it here afterwards
          # would mean rewriting a binary Xcode has already signed on an
          # incremental build -- which produces an app that will not launch.
          set -euo pipefail
          case "$PLATFORM_NAME" in
            xrsimulator) SLICE=xros-arm64-simulator; PLATFORMS=XRSimulator ;;
            *)           SLICE=xros-arm64;           PLATFORMS=XROS ;;
          esac
          SRC="$SRCROOT/deps/openal.xcframework/$SLICE"
          LIB="$(/bin/ls "$SRC"/libopenal.*.dylib 2>/dev/null | head -1)"
          if [ -z "$LIB" ]; then
            echo "error: no libopenal dylib in $SRC" >&2; exit 1
          fi

          DST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          FW="$DST/openal.framework"
          mkdir -p "$DST"

          # ONLY WHEN SOMETHING CHANGED. This phase runs on every build (it has
          # to: the framework is not a build product Xcode tracks), and rewriting
          # a file the app's signature already seals leaves the bundle reported
          # as "a sealed resource is missing or invalid" -- on an incremental
          # build Xcode sees the app as up to date and never re-signs it. The
          # stamp lives outside the bundle so nothing unexpected is sealed.
          STAMP="${DERIVED_FILE_DIR:-$TARGET_TEMP_DIR}/openal-embed.stamp"
          WANT="$(/usr/bin/stat -f '%m %z' "$LIB") $PLATFORMS"
          if [ -f "$FW/openal" ] && [ "$(cat "$STAMP" 2>/dev/null || true)" = "$WANT" ]; then
            exit 0
          fi
          # A bare copy from an older build of this same app would be shipped
          # alongside the framework and rejected on its own.
          rm -f "$DST"/libopenal.*.dylib
          rm -rf "$FW"
          mkdir -p "$FW"
          cp -f "$LIB" "$FW/openal"

          cat > "$FW/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>openal</string>
            <key>CFBundleIdentifier</key><string>${PRODUCT_BUNDLE_IDENTIFIER}.openal</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>openal</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>${XROS_DEPLOYMENT_TARGET}</string>
            <key>CFBundleSupportedPlatforms</key><array><string>${PLATFORMS}</string></array>
          </dict>
          </plist>
          PLIST

          # The bundle, not just the binary inside it: an embedded framework is
          # sealed as a whole and the app's own signature covers that seal.
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-}" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              ${OTHER_CODE_SIGN_FLAGS:-} "$FW"
          fi

          mkdir -p "$(dirname "$STAMP")"
          printf '%s' "$WANT" > "$STAMP"

  # ------------------------------------------------- immersive shell
  # The SwiftUI shell that owns @main for the VR presentation: a launcher
  # window and a fully immersive space, switched at runtime and remembered
  # across launches.
  #
  # A separate target from `gen1recomp` for now because the two disagree about
  # who owns @main -- SDL does in the flat build, SwiftUI does here -- and they
  # need different Info.plists for exactly that reason. They converge into one
  # target once liblove renders headless into a virtual screen, at which point
  # SDL stops owning a window at all and both presentations become two views of
  # the same texture.
  gen1recomp-immersive:
    type: application
    platform: visionOS
    sources:
      - path: native/immersive
      # love.cpp carries the visionOS boot entry point. LOVE_NO_MAIN below
      # suppresses its main(), which would otherwise collide with SwiftUI's.
      - path: love-src/src/love.cpp
        group: love
      - path: resources/game.love
        buildPhase: resources
        type: file
        optional: true
      # The app icon. visionOS wants three layers rather than one image --
      # the system parallaxes them as the wearer looks at it -- so this is a
      # .solidimagestack in an asset catalogue rather than a PNG in the plist.
      # The catalogue is a normal source entry, not a folder reference: it has
      # to be COMPILED, and a folder reference would copy the .xcassets in
      # whole and leave the app with no icon at all.
      - path: resources/Assets.xcassets
        buildPhase: resources
      # Folder references, so each .lproj lands in the bundle root under its
      # own name -- which is where the system looks for a language. English is
      # the development region and the fallback: a key missing from de.lproj
      # resolves out of en.lproj, and one missing from both resolves to
      # itself, so an untranslated string reads as English rather than as an
      # identifier.
      - path: resources/en.lproj
        buildPhase: resources
        type: folder
      - path: resources/de.lproj
        buildPhase: resources
        type: folder
    dependencies:
      - target: liblove
      - framework: deps/luajit.xcframework
        embed: false
      - framework: deps/sdl3.xcframework
        embed: false
      - framework: deps/freetype.xcframework
        embed: false
      - framework: deps/harfbuzz.xcframework
        embed: false
      - framework: deps/ogg.xcframework
        embed: false
      - framework: deps/vorbis.xcframework
        embed: false
      - framework: deps/theora.xcframework
        embed: false
      - framework: deps/modplug.xcframework
        embed: false
      - framework: deps/openal.xcframework
        embed: false
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreHaptics.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UIKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: Foundation.framework
      - sdk: libz.tbd
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - LOVE_NO_MAIN=1
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        PRODUCT_NAME: gen1recomp-immersive
        PRODUCT_BUNDLE_IDENTIFIER: de.martek.gen1vision
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: $(SRCROOT)/overlays/love-visionos.plist
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/overlays/gen1recomp-visionos.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/native/gen1recomp-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
    postBuildScripts:
      - name: Embed and sign openal-soft
        basedOnDependencyAnalysis: false
        script: |
          # A framework, not a bare dylib -- App Store Connect rejects the
          # second one and blames Swift for it. The reasoning is written out on
          # the flat target's copy of this script.
          set -euo pipefail
          case "$PLATFORM_NAME" in
            xrsimulator) SLICE=xros-arm64-simulator; PLATFORMS=XRSimulator ;;
            *)           SLICE=xros-arm64;           PLATFORMS=XROS ;;
          esac
          SRC="$SRCROOT/deps/openal.xcframework/$SLICE"
          LIB="$(/bin/ls "$SRC"/libopenal.*.dylib 2>/dev/null | head -1)"
          if [ -z "$LIB" ]; then echo "error: no libopenal dylib in $SRC" >&2; exit 1; fi

          DST="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          FW="$DST/openal.framework"
          mkdir -p "$DST"

          # ONLY WHEN SOMETHING CHANGED. This phase runs on every build (it has
          # to: the framework is not a build product Xcode tracks), and rewriting
          # a file the app's signature already seals leaves the bundle reported
          # as "a sealed resource is missing or invalid" -- on an incremental
          # build Xcode sees the app as up to date and never re-signs it. The
          # stamp lives outside the bundle so nothing unexpected is sealed.
          STAMP="${DERIVED_FILE_DIR:-$TARGET_TEMP_DIR}/openal-embed.stamp"
          WANT="$(/usr/bin/stat -f '%m %z' "$LIB") $PLATFORMS"
          if [ -f "$FW/openal" ] && [ "$(cat "$STAMP" 2>/dev/null || true)" = "$WANT" ]; then
            exit 0
          fi
          rm -f "$DST"/libopenal.*.dylib
          rm -rf "$FW"
          mkdir -p "$FW"
          cp -f "$LIB" "$FW/openal"

          cat > "$FW/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>openal</string>
            <key>CFBundleIdentifier</key><string>${PRODUCT_BUNDLE_IDENTIFIER}.openal</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>openal</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>${XROS_DEPLOYMENT_TARGET}</string>
            <key>CFBundleSupportedPlatforms</key><array><string>${PLATFORMS}</string></array>
          </dict>
          </plist>
          PLIST

          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-}" != "NO" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              ${OTHER_CODE_SIGN_FLAGS:-} "$FW"
          fi

          mkdir -p "$(dirname "$STAMP")"
          printf '%s' "$WANT" > "$STAMP"

schemes:
  gen1recomp:
    build:
      targets:
        gen1recomp: all
    run:
      config: Debug
    archive:
      config: Release
  gen1recomp-immersive:
    build:
      targets:
        gen1recomp-immersive: all
    run:
      config: Debug
